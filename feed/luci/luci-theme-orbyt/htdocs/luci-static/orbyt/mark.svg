<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!--
		Orbyt's mark (orbyt-theme D4): the pages' icon, whose inks follow the
		browser's preference, as an icon file cannot read the page's pinned mode.
	-->
	<style>
		.a { stop-color: #059669; }
		.b { stop-color: #10b981; }
		.c { stop-color: #1e40af; }
		@media (prefers-color-scheme: dark) {
			.a { stop-color: #64ffda; }
			.c { stop-color: #0284c7; }
		}
	</style>
	<defs>
		<linearGradient id="stream" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="56" y2="56">
			<stop class="a" offset="0"/>
			<stop class="b" offset=".5"/>
			<stop class="c" offset="1"/>
		</linearGradient>
		<mask id="gap">
			<rect width="64" height="64" fill="#fff"/>
			<circle cx="46.85" cy="17.15" r="9.6" fill="#000"/>
		</mask>
	</defs>
	<circle cx="32" cy="32" r="21" fill="none" stroke="url(#stream)" stroke-width="6.5" mask="url(#gap)"/>
	<circle cx="46.85" cy="17.15" r="6.4" fill="url(#stream)"/>
</svg>
