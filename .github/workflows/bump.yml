# The weekly bump of upstream.lock (r4s-release-pipeline D5): when a repository
# of the lock moved, a pull request from bump/<date> with the new lock, the old
# and new SHAs and the commits in between. The workflow's token starts no
# workflow with its pushes and pull requests, and a dispatched run counts for no
# pull request, so the bot pushes and opens the pull request with the
# maintainer's BUMP_PUSH_TOKEN: the push starts the branch's build, which signs
# the candidate, drills the upgrade to it and publishes it as a pre-release, and
# the pull request starts its check; main's rules merge nothing before the
# branch's drill passed (bump-branch-runs D2). A branch of the day that exists
# stays as it is, as it may carry the maintainer's commits; a run then only opens
# the pull request it lacks (release-integrity D5).
name: bump

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# The workflow's own token only reads: BUMP_PUSH_TOKEN pushes and opens.
permissions:
  contents: read

concurrency:
  group: bump
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Its credentials push the branch. Without the secret the workflow's token
      # checks out, enough to find that upstream has not moved.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BUMP_PUSH_TOKEN || github.token }}

      - uses: ./.github/actions/nix

      - name: Bump upstream.lock
        run: nix develop .#quality -c just upstream-bump "$RUNNER_TEMP/pull-request.md"

      - name: Open the pull request
        env:
          PUSH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
          GH_TOKEN: ${{ secrets.BUMP_PUSH_TOKEN }}
        run: |
          description="$RUNNER_TEMP/pull-request.md"
          if [ ! -s "$description" ]; then
            echo "upstream has not moved"
            exit 0
          fi
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::no secret BUMP_PUSH_TOKEN: the bump pushes and opens its pull request with a token whose pushes start workflows (docs/release-flow.md); nothing was pushed"
            exit 1
          fi
          branch="bump/$(date -u +%Y-%m-%d)"
          title=$(head -n 1 "$description")
          tail -n +3 "$description" >"$RUNNER_TEMP/body.md"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch exists already: it stays as it is"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git commit -q -m "$title" upstream.lock
            git push -q origin "$branch"
          fi
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[].number')" ]; then
            echo "$branch has its pull request"
          elif ! gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"; then
            echo "::error::cannot open the pull request of $branch: BUMP_PUSH_TOKEN needs Pull requests read and write; its build runs, open it by hand"
            exit 1
          fi
