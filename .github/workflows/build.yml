# Build the firmware of every board (boards/) in two stages that each fit in the
# 6-hour job limit, test each board's image in the emulator (r4s-build-foundation D11), then
# sign and release them together (r4s-release-pipeline D2, D3, D5; board-model D9):
#   host-toolchain: tools and every toolchain, board-neutral: the cross
#                   toolchain, Go and Rust (build-acceleration D2), cached by the
#                   inputs that affect them; the list of boards
#   firmware:       per board, the target code only (ci profile: all kmods), unsigned
#   caches:         of this ref's caches, only the current and newest stay: the
#                   toolchain, and one download cache and compiler cache per stage;
#                   on main, the caches of merged or deleted branches go
#   system-test:    per board, the system tests against the shipped image, JUnit
#                   reports, in parallel emulators (the drill among them, with
#                   test keys)
#   sign:           the pinned signing tools on every board's unsigned artifacts;
#                   the keys exist only in the release-signing environment, whose
#                   reviewers approve every run
#   drill:          per board, the latest stable release upgraded to the signed
#                   candidate in the emulator, with the production trust anchors
#   upgrade-drill:  the check main's rules require: the system tests passed, and
#                   every drill passed or signing did not run
#   publish:        one release of every board: a candidate (pre-release) from a
#                   bump branch, stable from main
# Signing and what follows run on main and bump/* once the release keys are in
# place (repository variable RELEASE_SIGNING = enabled). Only sign has a secret.
# A bump branch's own run, started by each push to it, decides its pull request:
# the pull request's run cannot sign, so it builds nothing and reports the drill
# check under another name (bump-branch-runs D1, D3).
name: build

# Code changes run it, and so do the documents system tests read (release-integrity
# D7; tests/build/test_ci.py holds the list to them); other documentation does not.
# One list for pushes and pull requests, which scripts/lib/runs.sh reads for the
# scripts that ask which commits a run of it builds (release-freshness D1).
on:
  push:
    branches: [main, "bump/**"]
    paths: &build-paths
      - "**"
      - "!openspec/**"
      - "!docs/**"
      - "!**/*.md"
      - docs/patches.md
      - docs/services.md
  pull_request:
    paths: *build-paths
  workflow_dispatch:

permissions:
  contents: read

# A new run cancels the older run of its ref; a re-run of an older run waits for
# the newer one instead of cancelling it (release-integrity D1).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}

defaults:
  run:
    # bash -eo pipefail: a failing command inside a pipe (e.g. | tee) fails the step.
    shell: bash

env:
  ORBYT_WORKDIR: /mnt/orbyt
  # The runner's large disk holds the tests' files as well.
  ORBYT_TESTDIR: /mnt/orbyt

jobs:
  host-toolchain:
    # Not in a bump pull request's run: every job after it is skipped with it.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      # cache-room reads the repository's cache usage.
      actions: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      boards: ${{ steps.boards.outputs.boards }}
      emulator: ${{ steps.emulator-key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          prepare-runner: true

      - name: Boards
        id: boards
        run: |
          boards=$(nix develop .#build -c just boards)
          echo "boards=${boards}" >> "$GITHUB_OUTPUT"

      # The tests' patched QEMU, which no binary cache holds: built here when
      # its inputs changed, and taken by every job that emulates, which then
      # builds none (tooling-hygiene D3).
      - name: Emulator key
        id: emulator-key
        run: nix develop .#quality -c just emulator-key >> "$GITHUB_OUTPUT"

      - name: Emulator built before
        id: emulator
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.emulator-key.outputs.key }}
          path: ${{ runner.temp }}/emulator
          lookup-only: true

      - name: Build emulator
        if: steps.emulator.outputs.cache-hit != 'true'
        run: nix develop .#quality -c just emulator-pack "$RUNNER_TEMP/emulator"

      - name: Save emulator
        if: steps.emulator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.emulator-key.outputs.key }}
          path: ${{ runner.temp }}/emulator

      - name: Fetch and patch sources
        run: nix develop .#build -c just fetch patch

      - name: Toolchain cache key
        id: key
        run: nix develop .#build -c just toolchain-key ci >> "$GITHUB_OUTPUT"

      - name: Restore toolchain
        id: cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/toolchain-cache.tar.zst

      # On a miss only, and read-only: the firmware jobs save the download cache,
      # and one saved first here would lack the target's sources under its key.
      - name: Download cache key
        if: steps.cache.outputs.cache-hit != 'true'
        id: download-key
        run: nix develop .#build -c just download-key >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.download-key.outputs.key }}
          restore-keys: ${{ steps.download-key.outputs.prefix }}
          path: ${{ env.ORBYT_WORKDIR }}/dl

      # The host stage's own compiler cache (build-acceleration D6): what an
      # earlier host build compiled, LLVM's C++ included, for one that only some
      # of its inputs changed (scripts/compiler-cache-key.sh).
      - name: Compiler cache key
        id: compiler-cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop .#build -c just compiler-cache-key host >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.compiler-cache.outputs.key }}
          restore-keys: ${{ steps.compiler-cache.outputs.prefix }}
          path: ${{ env.ORBYT_WORKDIR }}/compiler-cache

      - name: Build tools and toolchains
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ORBYT_COMPILER_CACHE_TRIM: 1
        run: |
          nix develop .#build -c just toolchain-build ci
          nix develop .#build -c just toolchain-pack "$ORBYT_WORKDIR/toolchain-cache.tar.zst"

      - name: Save toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/toolchain-cache.tar.zst

      # Off the default branch, only within the quota's room, so that main's
      # caches stay (build-integrity D5); the toolchain above is saved regardless.
      - name: Room for the compiler cache
        id: compiler-cache-room
        if: always() && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: nix develop .#build -c just cache-room "$ORBYT_WORKDIR/compiler-cache" >> "$GITHUB_OUTPUT"

      - name: Save compiler cache
        if: always() && steps.compiler-cache-room.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.compiler-cache.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/compiler-cache

  firmware:
    needs: host-toolchain
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: read
      # cache-room reads the repository's cache usage.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          prepare-runner: true

      - name: Fetch, patch and configure
        run: nix develop .#build -c just fetch patch config "$BOARD" ci

      - name: Download cache key
        id: download-key
        run: nix develop .#build -c just download-key >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.download-key.outputs.key }}
          restore-keys: ${{ steps.download-key.outputs.prefix }}
          path: ${{ env.ORBYT_WORKDIR }}/dl

      # Every language's compiler cache in one (build-acceleration D6), the
      # board's own (scripts/compiler-cache-key.sh).
      - name: Compiler cache key
        id: compiler-cache
        run: nix develop .#build -c just compiler-cache-key "$BOARD" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.compiler-cache.outputs.key }}
          restore-keys: ${{ steps.compiler-cache.outputs.prefix }}
          path: ${{ env.ORBYT_WORKDIR }}/compiler-cache

      # Restored last, so that the toolchain is the most recently used of the
      # caches this job restores: past the quota GitHub evicts the least recently
      # used, which is then a download or compiler cache this run supersedes, not
      # the toolchain that a re-run of this job needs.
      - name: Restore toolchain
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/toolchain-cache.tar.zst
          fail-on-cache-miss: true

      - name: Unpack toolchain
        run: nix develop .#build -c just toolchain-unpack "$ORBYT_WORKDIR/toolchain-cache.tar.zst"

      # Every source the build needs, before it builds: the download cache is
      # saved only when this step got them all (release-integrity D6).
      - name: Download sources
        id: download
        run: nix develop .#build -c just download

      - name: Build firmware
        env:
          # The board's own cache: it keeps what this build used (scripts/build.sh).
          ORBYT_COMPILER_CACHE_TRIM: 1
        # Its recipe's dependencies are this job's steps before it.
        run: nix develop .#build -c just --no-deps build "$BOARD" ci

      - name: Restore emulator
        id: emulator
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.emulator }}
          path: ${{ runner.temp }}/emulator

      - name: Import emulator
        if: steps.emulator.outputs.cache-hit == 'true'
        run: nix develop .#quality -c just emulator-unpack "$RUNNER_TEMP/emulator"

      - uses: ./.github/actions/uv-cache

      # The tests that read the build tree, which only this job has; the system
      # tests run on the build's outputs (test-hygiene D8).
      - name: Build tree tests
        run: nix develop -c just test "$BOARD" ci -m build_tree -rs

      # Off the default branch, only within the quota's room, so that main's
      # caches stay (build-integrity D5): the room for both caches, which every
      # board's job may save at once (release-integrity D6).
      - name: Room for the caches
        id: room
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORBYT_CACHE_SAVERS: ${{ strategy.job-total }}
        run: nix develop .#build -c just cache-room "$ORBYT_WORKDIR/dl" "$ORBYT_WORKDIR/compiler-cache" >> "$GITHUB_OUTPUT"

      - name: Save download cache
        if: always() && steps.download.outcome == 'success' && steps.room.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.download-key.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/dl

      - name: Save compiler cache
        if: always() && steps.room.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.compiler-cache.outputs.key }}
          path: ${{ env.ORBYT_WORKDIR }}/compiler-cache

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.board }}
          path: ${{ env.ORBYT_WORKDIR }}/openwrt/logs
          if-no-files-found: ignore

      - name: Upload unsigned firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.ORBYT_WORKDIR }}/out/${{ matrix.board }}/ci
          if-no-files-found: error

  # Every run saves a compiler cache per board, holding what its build used, and,
  # whenever their inputs change, a download cache, a toolchain and the host
  # stage's compiler cache; off the default branch, a compiler or download cache
  # only within the quota's room. Past the 10 GB quota GitHub evicts the least
  # recently used caches, so the firmware jobs restore the toolchain last. The
  # run then keeps, of its own ref's caches, the current toolchain, the newest
  # download cache, the newest emulator, and the newest compiler cache of each
  # stage: the host's and each board's. On main, the caches of merged or deleted branches go too
  # (scripts/cache-prune.sh). The job runs no build code.
  caches:
    needs: [host-toolchain, firmware]
    if: always() && github.event_name != 'pull_request' && needs.host-toolchain.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix

      - name: Prune caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOLCHAIN: ${{ needs.host-toolchain.outputs.key }}
        run: nix develop .#quality -c just cache-prune "$TOOLCHAIN"

  system-test:
    needs: [host-toolchain, firmware]
    name: system-test (${{ matrix.board }}, ${{ matrix.suite.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
        # A board's system tests, each module in one suite (build/ci "System tests
        # within job time limits"), each suite well within the limit on a runner
        # 1.8 times slower than usual (ci-system-split D1).
        suite:
          - name: upgrade
            paths: firmware/test_ab_upgrade.py firmware/test_ab_layout.py
          - name: boot
            paths: firmware/test_boot_rollback.py firmware/test_health_check.py
          - name: system
            paths: >-
              build firmware/test_base_system.py firmware/test_kernel.py
              firmware/test_rootfs.py firmware/test_toolchain.py firmware/test_web_theme.py
              quality testing unit
          - name: network
            paths: network
          - name: services
            paths: storage services
          - name: release
            paths: release ops
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          prepare-runner: true

      - uses: actions/download-artifact@v8
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.ORBYT_WORKDIR }}/out/${{ matrix.board }}/ci

      - name: Restore emulator
        id: emulator
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.emulator }}
          path: ${{ runner.temp }}/emulator

      - name: Import emulator
        if: steps.emulator.outputs.cache-hit == 'true'
        run: nix develop .#quality -c just emulator-unpack "$RUNNER_TEMP/emulator"

      - name: Host environment
        run: |
          nix develop -c just env-report | tee env-report.txt
          { echo '### Host environment'; echo '```'; cat env-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - id: uv-cache
        uses: ./.github/actions/uv-cache

      # The tests that read the build tree ran in the firmware job, where the
      # tree is (test-hygiene D8).
      - name: System tests
        run: nix develop -c just test "$BOARD" ci ${{ matrix.suite.paths }} -m "not build_tree" -rs

      - if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/uv-cache
        with:
          save: true

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-report-${{ matrix.board }}-${{ matrix.suite.name }}
          path: tests/.reports
          include-hidden-files: true
          if-no-files-found: error

      # The router's serial console over the whole run: what it did while a
      # failing test waited, which the report cannot show.
      - name: Console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-console-${{ matrix.board }}-${{ matrix.suite.name }}
          # QEMU's log names a reset the console does not explain (trial-boot-resilience D5).
          path: |
            ${{ env.ORBYT_TESTDIR }}/test/${{ matrix.board }}/emulator*/console.log
            ${{ env.ORBYT_TESTDIR }}/test/${{ matrix.board }}/emulator*/qemu*.log
          if-no-files-found: ignore

  # The keys exist only in the release-signing environment, whose reviewers
  # approve every run; this job runs nothing but the pinned signing tools on
  # what the firmware jobs built, every board's build in one approval. Main and
  # the weekly bump branches only, never a pull request, once the release keys
  # are in place.
  sign:
    needs: system-test
    if: >-
      vars.RELEASE_SIGNING == 'enabled' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/bump/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix

      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-unsigned-*
          path: ${{ runner.temp }}/unsigned

      - name: Sign
        env:
          APK_KEY: ${{ secrets.RELEASE_APK_KEY }}
          FW_KEY: ${{ secrets.RELEASE_FW_KEY }}
        run: |
          umask 077
          printf '%s\n' "$APK_KEY" >"$RUNNER_TEMP/apk.key"
          printf '%s\n' "$FW_KEY" >"$RUNNER_TEMP/fw.key"
          # Each build as the board its artifact is named after, which
          # release-sign checks (release-integrity D2).
          for build in "$RUNNER_TEMP"/unsigned/firmware-unsigned-*/; do
            build=${build%/}
            board=${build##*/firmware-unsigned-}
            nix run .#sign-tools -- scripts/release-sign.sh "$build" "$RUNNER_TEMP/signed/$board" \
              --board "$board" --apk-key "$RUNNER_TEMP/apk.key" --fw-key "$RUNNER_TEMP/fw.key"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-signed
          path: ${{ runner.temp }}/signed
          if-no-files-found: error

  # Per board, the latest stable release (or this build, before the first)
  # upgraded to the signed candidate in the emulator, trusting only its own
  # release keys: the drill tests, as system-test runs them with test keys.
  drill:
    needs: [host-toolchain, sign]
    name: drill (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.host-toolchain.outputs.boards) }}
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix
        with:
          prepare-runner: true

      - uses: actions/download-artifact@v8
        with:
          name: firmware-unsigned-${{ matrix.board }}
          path: ${{ env.ORBYT_WORKDIR }}/out/${{ matrix.board }}/ci

      - uses: actions/download-artifact@v8
        with:
          name: firmware-signed
          path: ${{ env.ORBYT_WORKDIR }}/signed

      - name: Restore emulator
        id: emulator
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.host-toolchain.outputs.emulator }}
          path: ${{ runner.temp }}/emulator

      - name: Import emulator
        if: steps.emulator.outputs.cache-hit == 'true'
        run: nix develop .#quality -c just emulator-unpack "$RUNNER_TEMP/emulator"

      - id: uv-cache
        uses: ./.github/actions/uv-cache

      - name: Drill base
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop -c just drill-base "$BOARD"

      - name: Upgrade drill
        env:
          ORBYT_SIGNED: ${{ env.ORBYT_WORKDIR }}/signed/${{ matrix.board }}
        run: nix develop -c just test "$BOARD" drill-base -m drill -rs

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drill-report-${{ matrix.board }}
          path: tests/.reports
          include-hidden-files: true
          if-no-files-found: error

      - name: Console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: drill-console-${{ matrix.board }}
          # QEMU's log names a reset the console does not explain (trial-boot-resilience D5).
          path: |
            ${{ env.ORBYT_TESTDIR }}/test/${{ matrix.board }}/emulator*/console.log
            ${{ env.ORBYT_TESTDIR }}/test/${{ matrix.board }}/emulator*/qemu*.log
          if-no-files-found: ignore

  # The check main's rules require (board-model D9), under the name it always
  # had: a matrix reports each board's drill on its own. scripts/drill-check.sh
  # decides it from the results. A bump's pull request builds nothing: there the
  # job takes another name and passes, so that the required check is the bump
  # branch's own run's, which drills; a skipped job would count as passed, and a
  # failed one would contradict it (bump-branch-runs D3).
  upgrade-drill:
    name: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/') && 'upgrade-drill of the branch' || 'upgrade-drill' }}
    needs: [system-test, sign, drill]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix

      - name: Every board's drill
        env:
          BUMP: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/') && '--bump-pull-request' || '' }}
          SYSTEM_TEST: ${{ needs.system-test.result }}
          SIGN: ${{ needs.sign.result }}
          DRILL: ${{ needs.drill.result }}
        run: |
          # shellcheck disable=SC2086 # BUMP is the flag or nothing
          nix develop .#quality -c just drill-check $BUMP "$SYSTEM_TEST" "$SIGN" "$DRILL"

  # One release of every board: a candidate (pre-release) from a bump branch, a
  # stable release from main, never before every board's drill passed.
  publish:
    needs: [drill, upgrade-drill]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/nix

      - uses: actions/download-artifact@v8
        with:
          name: firmware-signed
          path: ${{ runner.temp }}/signed

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.ref != 'refs/heads/main' && '--prerelease' || '' }}
        run: >-
          nix develop .#quality -c just release-publish "$RUNNER_TEMP/signed" "$RUNNER_TEMP/release"
          ${CANDIDATE:+"$CANDIDATE"} --upload
