# Classes LuCI's stock theme (bootstrap) styles and luci-theme-orbyt does not, each
# with its reason (orbyt-theme D8). tests/firmware/test_web_theme.py fails on a
# class missing from both the theme and this list, and on an entry the theme now
# styles or bootstrap no longer does.

[[class]]
class = "nav"
reason = "bootstrap's top bar of menus, which the sidebar replaces"

[[class]]
class = "menu"
reason = "bootstrap's top-bar menu entries (a.menu), which the sidebar's groups replace"

[[class]]
class = "dropdown-menu"
reason = "bootstrap's top-bar submenus, which the sidebar's groups replace"

[[class]]
class = "dropdown-toggle"
reason = "bootstrap's top-bar submenu arrows; the sidebar's groups are always open"

[[class]]
class = "menu-dropdown"
reason = "bootstrap's top-bar submenus in tab bars, drawn by bootstrap's menu alone"

[[class]]
class = "breadcrumb"
reason = "bootstrap's footer list of modes, which the sidebar's foot replaces"

[[class]]
class = "divider"
reason = "the separators of bootstrap's footer list of modes"

[[class]]
class = "cbi-rowstyle-2"
reason = "bootstrap's striped rows; the theme separates a table's rows by hairlines alone (orbyt-theme D3)"

# Styled by bootstrap, named by no view, script or template of LuCI's feed or this
# repository's (orbyt-theme D3).

[[class]]
class = "cbi-button-find"
reason = "a button style no LuCI view asks for"

[[class]]
class = "cbi-select"
reason = "a wrapper around selects that LuCI's widgets no longer draw"

[[class]]
class = "pull-left"
reason = "a float helper no LuCI view uses"

[[class]]
class = "pull-right"
reason = "a float helper no LuCI view uses"

[[class]]
class = "secondary-action"
reason = "a slot in the page actions that no LuCI view fills"

[[class]]
class = "tab-content"
reason = "bootstrap's tab panes, which LuCI's views no longer build"

[[class]]
class = "tab-pane"
reason = "bootstrap's tab panes, which LuCI's views no longer build"

[[class]]
class = "unstyled"
reason = "a bare list style no LuCI view uses"

[[class]]
class = "valign-middle"
reason = "a table alignment no LuCI view uses"
