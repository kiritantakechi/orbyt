# pytest configuration of the system tests (r4s-build-foundation D13).
[pytest]
minversion = "9.1"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-p", "orbyt_tests.model.markers",
    # labgrid's plugin imports its coordinator's client, and with it grpc, whose
    # extension turns the GIL back on; the tests take labgrid's drivers alone and
    # their target from the device layer (python-style D1).
    "-p", "no:labgrid",
]
testpaths = ["."]
# pytest skips build/ and dist/ by default; here build/ holds the build/* specs.
norecursedirs = [".*", "__pycache__"]
python_files = ["test_*.py"]
xfail_strict = true
junit_family = "xunit2"
