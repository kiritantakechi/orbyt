[project]
name = "orbyt-tests"
version = "0"
description = "System tests for the Orbyt firmware: one test per spec scenario (design D13)"
requires-python = ">=3.15"
dependencies = [
    "labgrid>=26.0",
    "pydantic>=2.12",
    "pytest==9.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
board-schema = "orbyt_tests.model.boards:main"
emu-prepare = "orbyt_tests.device.prepare:main"
lib-check = "orbyt_tests.model.lib_check:main"
spec-coverage = "orbyt_tests.model.coverage:main"

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "tach==0.35.3",
    "ty==0.0.106",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Python comes from uv itself, pinned by .python-version, never from the host.
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "orbyt_tests"
module-root = ""
